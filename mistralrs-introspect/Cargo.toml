[package]
name = "mistralrs-introspect"
version = "0.1.0"
edition = "2021"
description = "Activation-level introspection MCP server with live dashboard for transformer models"
license = "MIT"

[[bin]]
name = "introspect"
path = "src/main.rs"

[dependencies]
mistralrs-core = { path = "../mistralrs-core", features = [] }
candle-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
axum.workspace = true
tower-http = { workspace = true, features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "0.14", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars.workspace = true

[features]
default = []
metal = ["candle-core/metal", "mistralrs-core/metal"]
cuda = ["candle-core/cuda", "mistralrs-core/cuda"]
